<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS OBJECTS</title>
    <link rel="stylesheet" href="courses.css">
    <script src="courses.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="courseName"></h1>
      <img alt="">
      <h2 id="courseCode"></h2>

      <section aria-labelledby="enrollment-heading">
        <h2 id="enrollment-heading">Enroll a Student</h2>
        <label for="sectionNumber">Section Number</label>
        <input id="sectionNumber" type="number">
        <button id="enrollStudent" type="button">Enroll Student</button>
      </section>

      <table>
        <thead>
            <tr>
              <th>Section#</th>
              <th>Room#</th>
              <th>#Enrolled</th>
              <th>Days</th>
              <th>Instructor</th>
            </tr>
        </thead>
        <tbody id="sections"></tbody>
      </table>
    </main>

    <footer>
      <p>&copy; 2026 My Courses</p>
    </footer>
  </body>
</html>
