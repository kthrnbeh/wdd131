<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS OBJECTS</title>
    <link rel="stylesheet" href="character.css">
    <script src="character.js" defer></script>
  </head>
  <body>

    <main class="card">
      <h1 id="characterName" class="name"></h1>
      <img class="image" src="" alt="Character image">
      <h2 id="characterSpecies"></h2>
    
    <p>Class: <span id="characterClass"></span></p>
    <p>Level: <span id="characterLevel"></span></p>
    <p>Health: <span id="characterHealth"></span></p>
    <div class="buttons">
      <button id="attacked">ATTACK</button>
      <button id="levelUp">LEVEL UP</button>
    </div>
    </main>
    <footer>
      <p>&copy; 2026 Character Card</p>
    </footer>
  </body>
</html>
