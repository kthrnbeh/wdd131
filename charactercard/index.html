<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS OBJECTS</title>
    <link rel="stylesheet" href="character.css">
    <script src="character.js" defer></script>
  </head>
  <body>

    <main class="card">
      <h1 id="characterName" class="name"></h1>
      <img class="image" src="" alt="Character image">
      <h2 id="characterSpecies"></h2>

      <table class="stats">
        <thead>
          <tr>
            <th>Class:</th>
            <th>Level:</th>
            <th>Health:</th>
          </tr>
        </thead>
        <tbody id="sections"></tbody>
      </table>
    </main>

    <footer>
      <p>&copy; 2026 Character Card</p>
    </footer>
  </body>
</html>
